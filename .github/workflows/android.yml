name: Android APK

on:
  push:
    paths:
      - "src/**"
      - "android/**"
      - "scripts/prepare-android.mjs"
      - "capacitor.config.json"
      - "package*.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Build Stickville City APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Build the game and sync it into the Android project
        run: npm run build:android

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../stickville-city.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stickville-city-apk
          path: stickville-city.apk

      - name: Publish as a download (prerelease)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stickville-apk-${{ github.ref_name == 'main' && 'latest' || 'preview' }}
          name: Stickville City (Android)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: stickville-city.apk
          body: |
            Android build of Stickville City from ${{ github.sha }}.
            Download stickville-city.apk on the phone, open it, and allow "install unknown apps" when asked.
            Newer builds install straight over the old one and keep the saved game.
