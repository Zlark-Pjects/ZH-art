name: Tecno Pilot APK

on:
  push:
    paths:
      - "android-agent/**"
      - ".github/workflows/android-agent.yml"
  workflow_dispatch:

concurrency:
  group: android-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk TecnoPilot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TecnoPilot-apk
          path: android-agent/TecnoPilot.apk
          retention-days: 30
